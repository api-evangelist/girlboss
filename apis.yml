name: Girlboss
description: >-
  Girlboss is a community and media brand for ambitious women, positioned as a
  navigator for the future of work — created to spark the thrill of possibility
  and to inspire and inform so members can find success on their own terms.
  Founded by Sophia Amoruso (author of #GIRLBOSS and founder of Nasty Gal),
  Girlboss grew from editorial content, newsletters, and the Girlboss Rally
  events into a community brand. Today girlboss.com runs as a Shopify-hosted
  storefront and brand site. Girlboss was surfaced as a portfolio company of
  Lightspeed Venture Partners; it publishes no first-party developer API, so
  this profile captures its public web, policy, and agent-facing (llms.txt /
  well-known) surface rather than an API.
